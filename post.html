<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>文章 · 小悟大人</title>
  <meta name="description" content="小悟大人的博客文章。">
  <meta name="theme-color" content="#749efc">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" id="siteFavicon">

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/all.min.css">
  <!-- 图标字体先预载：否则首帧菜单只有文字、图标晚一拍才出现（看着像"闪一下"） -->
  <link rel="preload" href="css/resources/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="css/resources/fa-regular-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/animate.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/blog.css">
  <link rel="stylesheet" href="css/md.css">
  <link href="https://fonts.googlefonts.cn/css?family=Capriola" rel="stylesheet">
</head>

<body data-page="post">
  <script src="js/dark.js"></script>

  <header class="topbar">
    <button class="nav-toggle" id="navToggle" type="button" aria-label="打开菜单" aria-expanded="false"
      aria-controls="sidebar">
      <i class="fa-solid fa-bars"></i>
    </button>
    <span class="topbar-name" id="topbarName">小悟大人</span>
    <a class="topbar-btn" href="blog.html" aria-label="返回文章列表">
      <i class="fa-solid fa-list"></i>
    </a>
    <button class="topbar-btn" type="button" data-toggle="modal" data-target="#supportModal" aria-label="赞赏">
      <i class="fa-solid fa-qrcode"></i>
    </button>
  </header>

  <div class="nav-backdrop" id="navBackdrop"></div>

  <!-- 侧栏与弹窗由 js/shell.js 注入 -->
  <aside class="sidebar" id="sidebar" data-active="blog" data-sub="阅读文章"></aside>
  <script src="js/shell.js"></script>

  <main class="main">
    <div class="content">

      <article class="card-ui sec article" id="article">
        <a class="article-back" href="blog.html">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i><span>全部文章</span>
        </a>

        <h1 class="article-title" id="articleTitle">加载中…</h1>
        <div class="article-meta" id="articleMeta"></div>
        <div class="article-body" id="articleBody"></div>

        <nav class="article-nav" id="articleNav" aria-label="上一篇与下一篇"></nav>
      </article>

    </div>
  </main>

  <script src="js/jquery-3.5.1.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/site.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/blog.js"></script>
  <script src="js/router.js"></script>
</body>

</html>
