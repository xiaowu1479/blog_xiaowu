<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>博客 · 小悟大人</title>
  <meta name="description" content="小悟大人的全部文章，支持按关键词搜索标题、摘要与正文。">
  <meta name="keywords" content="小悟大人,博客,文章,搜索">
  <meta name="theme-color" content="#749efc">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" id="siteFavicon">

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/all.min.css">
  <!-- 图标字体先预载：否则首帧菜单只有文字、图标晚一拍才出现（看着像"闪一下"） -->
  <link rel="preload" href="css/resources/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="css/resources/fa-regular-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/animate.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/blog.css">
  <link href="https://fonts.googlefonts.cn/css?family=Capriola" rel="stylesheet">
</head>

<body data-page="blog">
  <script src="js/dark.js"></script>

  <header class="topbar">
    <button class="nav-toggle" id="navToggle" type="button" aria-label="打开菜单" aria-expanded="false"
      aria-controls="sidebar">
      <i class="fa-solid fa-bars"></i>
    </button>
    <span class="topbar-name" id="topbarName">小悟大人</span>
    <a class="topbar-btn" href="index.html" aria-label="返回首页">
      <i class="fa-solid fa-house"></i>
    </a>
    <button class="topbar-btn" type="button" data-toggle="modal" data-target="#supportModal" aria-label="赞赏">
      <i class="fa-solid fa-qrcode"></i>
    </button>
  </header>

  <div class="nav-backdrop" id="navBackdrop"></div>

  <!-- 侧栏与弹窗由 js/shell.js 注入，8 项菜单和其它页面完全一致 -->
  <aside class="sidebar" id="sidebar" data-active="blog" data-sub="全部文章"></aside>
  <script src="js/shell.js"></script>

  <main class="main">
    <div class="content">

      <section class="card-ui sec" aria-labelledby="blogTitle">
        <div class="sec-head">
          <h2 class="sec-title" id="blogTitle"><i class="fa-solid fa-pen-nib"></i>全部文章</h2>
          <span class="sec-sub" id="blogCount"></span>
        </div>

        <div class="blog-cats" id="blogCats" aria-label="按分类筛选"></div>

        <div class="blog-tools">
          <label class="blog-search" for="blogSearch">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input id="blogSearch" type="search" placeholder="搜索标题、摘要或正文…" autocomplete="off"
              spellcheck="false" maxlength="80">
            <button class="blog-search__clear" id="blogSearchClear" type="button" aria-label="清空搜索" hidden>
              <i class="fa-solid fa-xmark"></i>
            </button>
          </label>
        </div>

        <div class="blog-list" id="blogList" aria-live="polite"></div>
        <nav class="blog-pager" id="blogPager" aria-label="文章分页"></nav>
      </section>

    </div>
  </main>

  <script src="js/jquery-3.5.1.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/site.js"></script>
  <script src="js/blog.js"></script>
  <script src="js/router.js"></script>
</body>

</html>
