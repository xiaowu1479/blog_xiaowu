<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小悟大人 · 个人主页</title>
  <meta name="description" content="这里是小悟大人的个人主页：简介、作品集、博客、相册与友链。程序语言不止于记录，更是艺术的呈现。">
  <meta name="keywords" content="小悟大人,个人主页,作品集,博客,友链">
  <meta name="theme-color" content="#749efc">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23749efc'/%3E%3Cstop offset='0.55' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%23f7a1c4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='36' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23ffffff'%3E%E6%82%9F%3C/text%3E%3C/svg%3E">

  <!-- 样式：前四个是模板原有文件（未改动），site.css 是二开层 -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/all.min.css">
  <!-- 图标字体先预载：否则首帧菜单只有文字、图标晚一拍才出现（看着像"闪一下"） -->
  <link rel="preload" href="css/resources/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="css/resources/fa-regular-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/animate.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/blog.css">
  <link href="https://fonts.googlefonts.cn/css?family=Capriola" rel="stylesheet">
</head>

<body>
  <script src="js/dark.js"></script>

  <!-- 欢迎提示 -->
  <div class="toast" id="welcomeToast" role="alert" aria-live="polite" aria-atomic="true" data-delay="2200">
    <div class="toast-body">欢迎你的到来 👋</div>
  </div>

  <!-- 移动端顶栏 -->
  <header class="topbar">
    <button class="nav-toggle" id="navToggle" type="button" aria-label="打开菜单" aria-expanded="false"
      aria-controls="sidebar">
      <i class="fa-solid fa-bars"></i>
    </button>
    <span class="topbar-name" id="topbarName">小悟大人</span>
    <button class="topbar-btn" type="button" data-toggle="modal" data-target="#supportModal" aria-label="赞赏">
      <i class="fa-solid fa-qrcode"></i>
    </button>
  </header>

  <!-- 抽屉遮罩 -->
  <div class="nav-backdrop" id="navBackdrop"></div>

  <!-- ==================== 左侧栏 ==================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="avatar-wrap sb-avatar-wrap">
        <img src="img/avatar.svg" class="sb-avatar" id="avatar" alt="头像">
        <div class="avatar-fallback sb-avatar-fallback" id="avatarFallback">悟</div>
      </div>
      <div class="sb-id">
        <div class="sb-name" id="siteName">小悟大人</div>
        <div class="sb-sub">个人主页</div>
      </div>
    </div>

    <nav class="sb-nav" aria-label="主导航">
      <span class="sb-label">浏览</span>
      <a href="index.html" class="is-active"><i class="fa-solid fa-house"></i><span>首页</span></a>
      <a href="works.html"><i class="fa-solid fa-code"></i><span>作品集</span></a>
      <a href="blog.html"><i class="fa-solid fa-pen-nib"></i><span>博客</span></a>
      <a href="gallery.html"><i class="fa-solid fa-images"></i><span>相册</span></a>
      <a href="links.html"><i class="fa-solid fa-link"></i><span>友链</span></a>

      <span class="sb-label">其他</span>
      <a href="#" data-toggle="modal" data-target="#aboutModal"><i class="fa-solid fa-feather-pointed"></i><span>关于</span></a>
      <a href="#" data-toggle="modal" data-target="#siteModal"><i class="fa-solid fa-globe"></i><span>旗下站点</span></a>
      <a href="#" data-toggle="modal" data-target="#supportModal"><i class="fa-solid fa-qrcode"></i><span>赞赏</span></a>
    </nav>

    <div class="sb-foot">
      <div class="sb-bottom">
        <div class="sb-bottom__left">
          <div class="mode-switch" title="切换深浅色">
            <div class="mode-switch__toggle">
              <div class="mode-switch__circle"></div>
            </div>
          </div>
          <a class="sb-admin" href="admin/" target="_blank" rel="noopener" title="进入后台管理">
            <i class="fa-solid fa-sliders"></i><span>后台</span>
          </a>
        </div>
        <a class="sb-icp" href="https://beian.miit.gov.cn/#/Integrated/index" target="_blank" rel="noopener">
          <i class="fa-regular fa-copyright"></i> <span id="footerYear">2026</span>
        </a>
      </div>
    </div>
  </aside>

  <!-- ==================== 正文 ==================== -->
  <main class="main">
    <div class="content">

      <!-- 1. 简介 -->
      <section class="card-ui hero" id="top">
        <div class="hero-head">
          <div class="hero-head-main">
            <h1 class="toem hero-sign" id="siteSign">天黑了.别忘记回家</h1>
            <div class="state">
              <span class="state__dot" aria-hidden="true"></span>
              <span id="siteStatus">iPhone 在线 😊</span>
            </div>
          </div>
          <button type="button" class="btn btn-link qr-btn" data-toggle="modal" data-target="#supportModal"
            title="赞赏" aria-label="打开赞赏">
            <i class="fa-solid fa-qrcode fa-lg"></i>
          </button>
        </div>

        <!-- 技能标签（由 site.js 渲染） -->
        <div class="skills-row" id="skills"></div>

        <!-- 工具行：正在播放 + 快捷入口 + 工具，统一 30px 高度、单行对齐 -->
        <div class="hero-bar">
          <div class="left-4-1" role="group" aria-label="正在播放">
            <span>
              <img id="musicCover" src="img/zainideshenbian.jpg" alt="正在播放：在你的身边">
              <div class="sh-main-top-mu" lang="0" onclick="syaudbf()" role="button" tabindex="0"
                aria-label="播放或暂停"
                onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();syaudbf();}">
                <i class="fa-regular fa-circle-play fa-lg" id="sh-main-top-mu" lang="0" data-bfzt="bb"></i>
              </div>
            </span>
            <div id="sh-main-top-g-m" class="sh-main-top-g-containe" lang="在你的身边">
              <div id="sh-main-top-mucisjd" lang="0" style="display:none;">
                <div class="shaft-load2">
                  <div class="shaft1"></div><div class="shaft2"></div><div class="shaft3"></div>
                  <div class="shaft4"></div><div class="shaft5"></div><div class="shaft6"></div>
                  <div class="shaft7"></div><div class="shaft8"></div><div class="shaft9"></div>
                  <div class="shaft10"></div><div class="shaft11"></div><div class="shaft12"></div>
                  <div class="shaft13"></div><div class="shaft14"></div><div class="shaft15"></div>
                  <div class="shaft16"></div><div class="shaft17"></div><div class="shaft18"></div>
                  <div class="shaft19"></div><div class="shaft20"></div>
                </div>
              </div>
            </div>
            <audio id="sh-main-top-musicplay-b"
              src="https://music.163.com/song/media/outer/url?id=2099010964.mp3" type="audio/mp3" controls
              style="display:none;"></audio>
            <audio id="musicplay" src="" type="audio/mp3" controls style="display:none;"
              lang="0">您的浏览器不支持音频元素。</audio>
          </div>

          <div class="left-4-2"><img src="img/wyy.svg" alt="网易云音乐"></div>

          <span class="hero-bar__sep" aria-hidden="true"></span>

          <a href="#top" class="qk" title="回到顶部" aria-label="回到顶部"><i class="fa-solid fa-arrow-up"></i></a>

          <div class="hero-bar__quick" id="quickLinks"></div>

          <a href="#links" class="qk qk--text" title="友链"><img src="img/qx.png" alt="">BLLTS</a>

          <span class="hero-bar__sep hero-bar__sep--end" aria-hidden="true"></span>

          <button class="btn btn-link tool-btn" type="button" data-toggle="collapse" data-target="#coll"
            aria-expanded="false" aria-controls="coll" aria-label="更多工具">
            <i class="fa-solid fa-bars fa-lg"></i>
          </button>

          <div class="left-4-4"><img src="img/China.svg" alt="中国"></div>

          <div class="collapse" id="coll">
            <div class="card card-body tool-pop">
              <button type="button" class="btn btn-link" data-toggle="modal" data-target="#siteModal"
                title="旗下站点"><img src="img/globe.svg" alt="旗下站点"></button>
              <button onclick="switchSakura()" class="btn btn-link" title="樱花飘落（模板预留）">
                <i class="fa-regular fa-circle-xmark fa-lg" style="color:pink;"></i>
              </button>
              <button type="button" class="btn btn-link" data-toggle="modal" data-target="#aboutModal"
                title="关于"><img src="img/information.svg" alt="关于"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- 2. 作品集 -->
      <section class="card-ui sec" id="works" aria-labelledby="worksTitle">
        <div class="sec-head">
          <h2 class="sec-title" id="worksTitle"><i class="fa-solid fa-code"></i>作品集</h2>
          <span class="sec-sub" id="worksCount"></span>
        </div>
        <div id="workList"></div>
      </section>

      <!-- 3. 博客 -->
      <section class="card-ui sec" id="blog" aria-labelledby="blogTitle">
        <div class="sec-head">
          <h2 class="sec-title" id="blogTitle"><i class="fa-solid fa-pen-nib"></i>博客</h2>
          <span class="sec-sub" id="postsCount"></span>
        </div>
        <div id="postList"></div>
        <div class="posts-foot">
          <a class="posts-more" id="postsMore" href="blog.html">
            全部文章 · <span data-total>0</span> 篇 <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
      </section>

      <!-- 4. 相册 -->
      <section class="card-ui sec" id="gallery" aria-labelledby="galleryTitle">
        <div class="sec-head">
          <h2 class="sec-title" id="galleryTitle"><i class="fa-solid fa-images"></i>相册</h2>
          <span class="sec-sub" id="photosCount"></span>
        </div>
        <div class="gallery" id="galleryGrid"></div>
      </section>

      <!-- 5. 友链 -->
      <section class="card-ui sec" id="links" aria-labelledby="linksTitle">
        <div class="sec-head">
          <h2 class="sec-title" id="linksTitle"><i class="fa-solid fa-link"></i>友链</h2>
          <span class="sec-sub" id="friendsCount"></span>
        </div>
        <div class="friends" id="friendList"></div>
      </section>

      <!-- 6. 页脚 -->
      <footer class="footer">
        <div class="runtime" id="runtime_span"></div>
        <div class="by">
          <i class="fa-regular fa-copyright fa-sm"></i>
          &nbsp;<span id="footerYearText">2026</span>&nbsp;<span id="footerName">小悟大人</span>
          &nbsp;|&nbsp;Designed by <a href="#top">小悟大人</a>
        </div>
        <div class="body-bottom">
          <a id="icpLink" href="https://beian.miit.gov.cn/#/Integrated/index" target="_blank" rel="noopener">
            <img src="img/icp.svg" alt="备案"><span id="footerIcp">苏ICP备</span>
          </a>
          <a class="footer-admin" href="admin/" target="_blank" rel="noopener" title="进入后台管理">
            <i class="fa-solid fa-sliders"></i> 后台管理
          </a>
        </div>
      </footer>

    </div>
  </main>

  <!-- ==================== 弹窗 ==================== -->

  <!-- 赞赏 -->
  <div class="modal fade" id="supportModal" tabindex="-1" aria-labelledby="supportTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="max-width:340px;margin:0 auto;">
        <div class="modal-header">
          <h5 class="modal-title" id="supportTitle">
            <i class="fa-solid fa-quote-left" style="color:#fb7474"></i>&nbsp;赞赏&nbsp;|&nbsp;为爱打赏&nbsp;
            <i class="fa-solid fa-quote-right" style="color:#fb7474"></i>
          </h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="关闭">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="pay-wrap" id="payBody"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 关于 -->
  <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="max-width:300px;margin:0 auto;">
        <div class="modal-header">
          <h5 class="modal-title" id="aboutTitle">
            <i class="fa-solid fa-quote-left" style="color:#74C0FC"></i>&nbsp;关于&nbsp;
            <i class="fa-solid fa-quote-right" style="color:#74C0FC"></i>
          </h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="关闭">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" id="aboutBody"></div>
      </div>
    </div>
  </div>

  <!-- 旗下站点 -->
  <div class="modal fade" id="siteModal" tabindex="-1" aria-labelledby="siteTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="max-width:280px;margin:0 auto;">
        <div class="modal-header">
          <h5 class="modal-title" id="siteTitle">
            <i class="fa-solid fa-quote-left" style="color:#74C0FC"></i>&nbsp;旗下站点&nbsp;
            <i class="fa-solid fa-quote-right" style="color:#74C0FC"></i>
          </h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="关闭">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" id="siteBody"></div>
      </div>
    </div>
  </div>

  <!-- 作品 / 文章详情 -->
  <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="max-width:420px;margin:0 auto;">
        <div class="modal-header">
          <h5 class="modal-title" id="detailTitle"></h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="关闭">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div id="detailMeta"></div>
          <div id="detailBody"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 图片灯箱 -->
  <div class="modal fade" id="photoModal" tabindex="-1" aria-label="图片预览" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body">
          <img id="photoModalImg" alt="">
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 脚本 ==================== -->
  <script src="js/jquery-3.5.1.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/player.js"></script>
  <script src="js/site.js"></script>
  <script src="js/router.js"></script>
</body>

</html>
